<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my super hero</title>
    <style>
        body {
            background-color: blueviolet;
            color: whitesmoke;
            font-family: Arial, Helvetica, sans-serif;
        }

        hero-name {
            font-size: 60px;
            font-weight: bold;
            color: aquamarine;
            text-shadow: 3px 3px orange;
        }

        .tagline {
            font-style: italic;
            color: aqua;
            text-transform: capitalize;
        }

        .label {
            text-transform: uppercase;
            text-decoration: aqua;
            color: beige;
        }

        .power {
            font-weight: bold;
            color: blanchedalmond;
        }

        .weakness {
            text-decoration: aliceblue;
            color: blue;
        }

        .badge {
            font-size: 28px;
            font-weight: bold;
            color: blueviolet;
            transform: rotate(15deg);
        }

        .made-by {
            color: aqua;
            font-style: italic;
        }
    </style>
</head>
<body>
    
    <h1 class="hero name">thunder kid</h1>
    <p class="tagline">the most powerful superhero</p>

    <h2 class="label">super powers</h2>
    <p class="power">can run faster than ssc thrust</p>
    <p class="power">can lift a boulder</p>
    
    <h2 class="label">weaknesses</h2>
    <p class="weakness">broccoli</p>
    <p class="weakness">maths homework</p>

    <p class="badge">top hero</p>
    
    <p class="made by">created by VIVAAN</p>

</body>

</html>
